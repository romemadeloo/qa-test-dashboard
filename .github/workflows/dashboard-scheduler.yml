name: Dashboard scheduler tick

# Backup caller for the QA-dashboard scheduler (app/api/cron/scheduler). Supabase pg_cron is the
# 15-minute tick (supabase/migrations/20261104000000_scheduler_pg_cron.sql); GitHub delays this
# schedule by hours under load, so it only fills in if pg_cron stops. The route dispatches each due
# occurrence once, however many callers reach it.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduler
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_CRON_SECRET: ${{ secrets.DASHBOARD_CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$DASHBOARD_CRON_SECRET" ]; then
            echo "DASHBOARD_URL or DASHBOARD_CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $DASHBOARD_CRON_SECRET" \
            "$DASHBOARD_URL/api/cron/scheduler"
